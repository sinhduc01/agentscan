name: agentscan
description: >-
  Scan AI agent assets (skill packs, MCP servers, agent configs) for hardcoded
  secrets, prompt injection, dangerous commands, and data exfiltration.

inputs:
  path:
    description: "File or directory to scan (default: current directory)"
    required: false
    default: "."
  fail-on:
    description: Fail when a finding at or above this severity is present (critical|high|medium|low|info)
    required: false
    default: "high"
  version:
    description: agentscan version to install (e.g. 0.1.0) or "git" for the latest commit on main
    required: false
    default: "git"
  json:
    description: Emit machine-readable JSON output
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install agentscan
      shell: bash
      env:
        AGENTSCAN_VERSION: ${{ inputs.version }}
      run: |
        if [ "$AGENTSCAN_VERSION" = "git" ]; then
          python -m pip install --quiet "git+https://github.com/sinhduc01/agentscan.git@main"
        else
          python -m pip install --quiet "agent-vetter==$AGENTSCAN_VERSION"
        fi

    - name: Run agentscan
      shell: bash
      env:
        AGENTSCAN_JSON: ${{ inputs.json }}
      run: |
        if [ "$AGENTSCAN_JSON" = "true" ]; then
          agentscan "${{ inputs.path }}" --fail-on "${{ inputs.fail-on }}" --json --no-color
        else
          agentscan "${{ inputs.path }}" --fail-on "${{ inputs.fail-on }}" --no-color
        fi
