[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentscan"
version = "0.1.0"
description = "Static security scanner for AI agent skill packs, MCP servers, and agent configs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "sinhduc01" }]
keywords = ["ai-agents", "security", "claude-code", "mcp", "prompt-injection", "skill", "scanner", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
agentscan = "agentscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
